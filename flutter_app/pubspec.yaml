name: basketball_highlights
description: "Pick basketball clips, mark the made shots on a timeline, export a highlight reel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  # GPL-3.0. Fine while this is a personal project; swap for Media3 Transformer if it ships closed.
  ffmpeg_kit_flutter_new: ^4.6.7
  camera: ^0.12.0+2
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # StreamQueue, for pulling one result at a time off the worker isolate in the live tests.
  async: ^2.11.0

flutter:
  uses-material-design: true

  assets:
    # Copy of ../fixtures/video_test_5_events.json; test/fixture_sync_test.dart fails if
    # the two diverge, so the on-screen demo cannot drift from the Python golden.
    - assets/fixtures/
    # best.pt -> tools/export_onnx.py -> copy here. Ignored by git (*.onnx), so a fresh
    # checkout has to run the export before the live camera screen can load a model.
    - assets/model/
