distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# services.gradle.org runs at ~50 KB/s from the only machine this project builds on, which is
# slow enough that the wrapper's own 120s lock timeout fires and fails the build. Tencent
# mirrors the same file at ~11 MB/s. The direct URL is kept below for other machines.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14-all.zip
#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
